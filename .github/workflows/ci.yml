name: CI

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: system deps for servo
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libclang-dev libfontconfig1-dev pkg-config
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-08-27
          components: rustc-codegen-cranelift-preview
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: check
          save-if: ${{ github.ref == 'refs/heads/master' }}
      # default-members = seer-bin (avoid building nodescraper with sqlx-sqlite link clash)
      - run: cargo check --workspace
      - run: cargo test -p seer-bin --test mount -- --nocapture

  # Warm Release-Cache on master (tags can restore it) and upload the LTO'd
  # binaries so tag releases can skip cargo/LTO entirely for the same commit.
  release-cache:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: system deps for servo
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libclang-dev libfontconfig1-dev pkg-config
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-08-27
      - uses: swatinem/rust-cache@v2
        with:
          shared-key: Release-Cache
          add-rust-environment-hash-key: false
          cache-workspace-crates: true
          cache-on-failure: true
          workspaces: |
            . -> target
            nodescraper-rs -> target
      - run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: seer-rs-${{ github.sha }}
          path: target/release/seer-rs
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: build nodescraper-rs
        env:
          REMOTE_URL: wss://seer.lariv.in/fleet/websocket
        run: cargo build --release --manifest-path nodescraper-rs/Cargo.toml
      - uses: actions/upload-artifact@v4
        with:
          name: nodescraper-rs-${{ github.sha }}
          path: nodescraper-rs/target/release/nodescraper-rs
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
