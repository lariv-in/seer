name: CI

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4


      - name: system deps for servo
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libclang-dev libfontconfig1-dev pkg-config

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-08-11
      - uses: Swatinem/rust-cache@v2
      # default-members = seer-bin (avoid building nodescraper with sqlx-sqlite link clash)
      - run: cargo check --release
      - run: cargo test -p seer-bin --test mount -- --nocapture
