[workspace]
members = [
    "seer-common",
    "seer-workerregistry",
    "seer-intel",
    "seer-node-fleet",
    "seer-websites",
    "seer-reddit",
    # "seer-twitter",
    # "seer-gdelt",
    "seer-opensky",
    "seer-aisstream",
    "seer-assistant",
    "seer-bin",
]
exclude = ["nodescraper-rs"]
# nodescraper-rs is vendored in-tree as its own nested Cargo workspace.
# Servo (rusqlite) and sea-orm (sqlx-sqlite) both `links = "sqlite3"` and cannot
# share a dependency graph. Build with:
#   cargo build --release --manifest-path nodescraper-rs/Cargo.toml
resolver = "2"
default-members = ["seer-bin"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
lariv-rs = {
	# path = "../../lariv-rs",
	git = "https://github.com/lariv-in/lariv-rs", rev = "f59579bc5e6fb4c300d296274f4b5f110274cf04",
	default-features = false,
	features = [
		"plugin-users",
		"plugin-dashboard",
		"plugin-filesystem",
		"plugin-llm-assistant",
		"plugin-otp",
		"plugin-pwa",
		"cap-llm",
	]
}
frunk = { version = "0.5.0", features = ["serde", "std"] }
frunk_core = "0.5.0"
tokio = { version = "1", features = ["full"] }
anyhow = { version = "1", features = ["backtrace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sea-orm = { version = "1.1", features = [
    "sqlx-postgres",
    "sqlx-sqlite",
    "runtime-tokio-rustls",
    "macros",
    "with-chrono",
    "with-json",
] }
sea-orm-migration = { version = "1.1", features = [
    "sqlx-postgres",
    "sqlx-sqlite",
    "runtime-tokio-rustls",
] }
async-trait = "0.1"
axum = { version = "0.8", features = ["form", "macros", "ws"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rune = "0.14"
maud = { version = "0.27", features = ["axum"] }
chrono = { version = "0.4", features = ["serde", "clock"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
prost = "0.14"
prost-types = "0.14"
prost-build = "0.14"
uuid = { version = "1", features = ["v4"] }
rand = "0.9"
parking_lot = "0.12"
url = "2"
feed-rs = "2"
scraper = "0.23"
regex = "1"
thiserror = "2"
bytes = "1"
base64 = "0.22"
ciborium = "0.2"
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-native-roots"] }
pgvector = { version = "0.4", features = ["sqlx"] }

seer-common = { path = "seer-common" }
seer-workerregistry = { path = "seer-workerregistry" }
seer-intel = { path = "seer-intel" }
seer-node-fleet = { path = "seer-node-fleet" }
seer-websites = { path = "seer-websites" }
seer-reddit = { path = "seer-reddit" }
# seer-twitter = { path = "seer-twitter" }
# seer-gdelt = { path = "seer-gdelt" }
seer-opensky = { path = "seer-opensky" }
seer-aisstream = { path = "seer-aisstream" }
seer-assistant = { path = "seer-assistant" }

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
